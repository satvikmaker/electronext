name: Build & Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Node version bundled with Electron 43 (24.18.0) and
          # satisfies the >=22.22.1 engines requirement from lint-staged 17.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 42 removed the postinstall download; the binary is otherwise
      # fetched lazily on first use, which would happen mid-build.
      - name: Download Electron binary
        run: npx install-electron

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package (dry run)
        run: npm run pack

      # Runs after packaging so the packaged-app suite has a binary to exercise.
      # Electron needs a display server on Linux.
      - name: Test (e2e)
        run: npm run test:e2e
        if: runner.os != 'Linux'

      - name: Test (e2e)
        run: xvfb-run -a npm run test:e2e
        if: runner.os == 'Linux'
