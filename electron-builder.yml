appId: com.electronext.app
productName: ElectroNext
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - electron/migrations/**/*
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.{md,ts,map}"
  - "!**/.git"

asar: true

# File associations — register the app to open these file types
# Customize the extension, name, and MIME type for your app.
fileAssociations:
  - ext: enx
    name: ElectroNext Document
    role: Editor
    mimeType: application/x-electronext

afterSign: scripts/notarize.mjs

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - nsis
  # `publisherName` moved under `signtoolOptions` in electron-builder 25.
  # It must match the CN of your code-signing certificate exactly.
  signtoolOptions:
    publisherName: ElectroNext

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

linux:
  icon: resources/icon.png
  category: Development
  target:
    - AppImage
    - deb

publish:
  provider: github
  owner: ""
  repo: ""
